<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="This Week">
  <meta name="theme-color" content="#e7eef6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>This Week</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e7eef6; color: #17191c; font: 16px/1.4 "Helvetica Neue", "Segoe UI", sans-serif; }
    .install { margin: 0; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: #0265dc; color: white; }
    iframe { position: fixed; left: 0; right: 0; bottom: 0; top: 0; width: 100%; height: 100%; border: 0; background: #e7eef6; }
    body.browser iframe { top: 74px; height: calc(100% - 74px); }
    body.installed .install { display: none; }
    body.signed-out iframe { opacity: 0; pointer-events: none; }
    .gate {
      display: none;
      position: fixed;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0;
      overflow: auto;
      box-sizing: border-box;
      padding: calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
      background:
        radial-gradient(900px 420px at 0% -10%, rgba(2, 101, 220, 0.22), transparent 60%),
        radial-gradient(700px 360px at 100% 0%, rgba(226, 79, 79, 0.16), transparent 55%),
        #e7eef6;
    }
    body.browser .gate { top: 74px; padding-top: 28px; }
    body.signed-out .gate { display: block; }
    .gate-inner { max-width: 420px; margin: 0 auto; }
    .eyebrow { margin: 0 0 4px; color: #0265dc; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; }
    .lede { color: #5c6370; max-width: 38ch; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-size: 13px; color: #5c6370; }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.78);
      border-radius: 12px;
      padding: 12px 14px;
      font: 16px/1.4 "Helvetica Neue", "Segoe UI", sans-serif;
      color: #17191c;
    }
    button {
      border: 0;
      border-radius: 999px;
      background: #e24f4f;
      color: white;
      font: 16px/1.4 "Helvetica Neue", "Segoe UI", sans-serif;
      padding: 12px 16px;
    }
    button:disabled { cursor: progress; }
    button.is-loading::before {
      content: "";
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      vertical-align: -2px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #e24f4f; margin: 0; }
    @media (prefers-reduced-motion: reduce) {
      button.is-loading::before { animation: none; }
    }
  </style>
</head>
<body class="signed-out">
  <p class="install">To open this full screen, use Share, then <strong>Add to Home Screen</strong>.</p>
  <section class="gate" id="gate">
    <div class="gate-inner">
      <p class="eyebrow">Task board</p>
      <h1>This week</h1>
      <p class="lede">Sign in to sort the sprint, update a task, or pull one in from the backlog.</p>
      <form id="loginForm" method="post" autocomplete="on">
        <label for="username">Username <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="vsosa" required></label>
        <label for="password">Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <p id="loginError" class="error" hidden></p>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </section>
  <iframe id="app" title="This Week" src="https://script.google.com/macros/s/AKfycbyJLwUjWgy36Jm1_NrVRG2mOEIyQUpugBsfo0MUmVgv-GJ0oJ9OYa7ndoRkoQEAUXoo/exec"></iframe>
  <script>
    var key = 'vinnyTaskBoardToken';
    var installed = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    document.body.classList.add(installed ? 'installed' : 'browser');
    var appWindow = null;
    var appOrigin = '';
    var pending = null;
    var signingIn = false;
    try {
      if (localStorage.getItem(key)) document.body.classList.remove('signed-out');
    } catch (err) {}

    var button = document.querySelector('#loginForm button');
    var errorEl = document.getElementById('loginError');
    var slowTimer = null;

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      var data = new FormData(event.target);
      pending = { username: data.get('username'), password: data.get('password') };
      setError('');
      setBusy(true);
      if (appWindow) sendLogin();
    });

    window.addEventListener('message', function (event) {
      var data = event.data || {};
      if (data.type === 'task-board-token') {
        try {
          if (data.token) localStorage.setItem(key, data.token);
          else localStorage.removeItem(key);
        } catch (err) {}
        if (!data.token) showGate();
        else if (!signingIn) showApp();
      }
      if (data.type === 'task-board-shown') showApp();
      if (data.type === 'task-board-login-error') {
        pending = null;
        setBusy(false);
        setError(data.message || 'Sign in failed.');
      }
      if (data.type === 'task-board-ready' && event.source) {
        appWindow = event.source;
        appOrigin = event.origin;
        var stored = '';
        try { stored = localStorage.getItem(key) || ''; } catch (err) {}
        event.source.postMessage({ type: 'task-board-token', token: stored }, event.origin);
        if (pending) sendLogin();
      }
    });

    function sendLogin() {
      if (!appWindow || !pending) return;
      var credentials = pending;
      pending = null;
      appWindow.postMessage({
        type: 'task-board-login',
        username: credentials.username,
        password: credentials.password
      }, appOrigin);
    }
    function showApp() {
      signingIn = false;
      pending = null;
      setBusy(false);
      document.body.classList.remove('signed-out');
    }
    function showGate() {
      signingIn = false;
      pending = null;
      setBusy(false);
      document.body.classList.add('signed-out');
    }
    function setBusy(busy) {
      signingIn = busy;
      button.disabled = busy;
      button.classList.toggle('is-loading', busy);
      button.setAttribute('aria-busy', busy ? 'true' : 'false');
      button.textContent = busy ? 'Signing in…' : 'Sign in';
      clearTimeout(slowTimer);
      if (busy) {
        slowTimer = setTimeout(function () {
          if (button.disabled) button.textContent = 'Still signing in…';
        }, 8000);
      }
    }
    function setError(text) {
      errorEl.hidden = !text;
      errorEl.textContent = text || '';
    }
  </script>
</body>
</html>
